[project]
name = "papertrade-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2",
  "psycopg[binary]",
  "pydantic-settings",
  "email-validator",
  "pyjwt",
  "argon2-cffi",
  "redis",
  "httpx>=0.28.1",
  "alembic>=1.20.1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "fakeredis"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
