services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: papertrade
      POSTGRES_PASSWORD: papertrade
      POSTGRES_DB: papertrade
    ports: ["55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata: {}
